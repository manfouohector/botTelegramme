# render.yaml – configuration for Render deployment
services:
  - type: web
    name: bot-telegramme
    env: node
    buildCommand: npm install
    startCommand: npm run start
    # The start script must launch the bot (e.g., node src/index.js)
    # Ensure you have a "start" script defined in package.json.
    envVars:
      - key: DATABASE_URL
        fromSecret: neon-db-url
      - key: TELEGRAM_BOT_TOKEN
        fromSecret: telegram-bot-token
      - key: TELEGRAM_FREE_CHANNEL_ID
        fromSecret: telegram-free-channel-id
      - key: TELEGRAM_PREMIUM_GROUP_ID
        fromSecret: telegram-premium-group-id
      - key: TELEGRAM_ADMIN_ID
        fromSecret: telegram-admin-id
      - key: COUPON_MIN_ODDS
        value: "1.5"
      - key: COUPON_MAX_DAILY
        value: "10"
    # Post‑deploy hook runs the migration once after each new deploy.
    postDeploy:
      command: node backend/scripts/run_migration_001.js
